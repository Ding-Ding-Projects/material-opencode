<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#6750A4", "options": ["#6750A4", "#00897B", "#FF8A65", "#3F51B5"], "section": "Theme"}, "dark": {"editor": "boolean", "default": false, "section": "Theme"}, "density": {"editor": "enum", "options": ["comfortable", "compact"], "default": "comfortable", "section": "Theme"}, "motion": {"editor": "boolean", "default": true, "section": "Theme"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const p = this.props || {};
const st = this.state || {};
const accent = p.accent ?? '#6750A4';
const dark = p.dark ?? false;
const motion = p.motion ?? true;
const density = p.density ?? 'comfortable';
const sd = {};
const s = {};
Object.keys(sd).forEach((k) => {
const d = sd[k];
const v = st['s_' + k] ?? d[0];
s[k] = { v: v, pct: Math.max(0, Math.min(100, ((v - d[1]) / (d[2] - d[1])) * 100)) + '%', set: (e) => this.setState({ ['s_' + k]: Number(e.target.value) }) };
});
const gd = {"ph_update": 1};
const g = {};
Object.keys(gd).forEach((k) => {
const cur = st['g_' + k] ?? gd[k];
const o = {};
for (let i = 0; i < 12; i++) { o['o' + i] = cur === i; o['p' + i] = () => this.setState({ ['g_' + k]: i }); }
g[k] = o;
});
const cd = {"c0": true, "c1": true};
const c = {};
Object.keys(cd).forEach((k) => {
const on = st['c_' + k] ?? cd[k];
c[k] = { on: on, set: () => this.setState({ ['c_' + k]: !on }) };
});
const td = {};
const t = {};
Object.keys(td).forEach((k) => {
t[k] = { v: st['t_' + k] ?? td[k], set: (e) => this.setState({ ['t_' + k]: e.target.value }) };
});
const rows = (name, list, extra) => list.map((row0, i) => {
const k = 'L_' + name + '_' + i;
const row = Object.assign({}, row0, st[k] || {});
const merge = (o) => this.setState({ [k]: Object.assign({}, st[k] || {}, o) });
return Object.assign(row, extra ? extra(row, merge) : {});
});
return { accent: accent, theme: dark ? 'dark' : 'light', motion: motion ? 'on' : 'off', density: density === 'compact' ? 'compact' : 'comfortable', s: s, g: g, c: c, t: t, setRoot: (el) => { if (el) el.style.setProperty('--acc', accent); } };
}
}
</script>
